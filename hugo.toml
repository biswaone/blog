baseURL = 'https://biswaone.github.io/'
locale = 'en-us'
title = 'Notes/Rambling of a 0x engineer'
theme = 'hugo-texify3'

enableRobotsTXT = true
enableGitInfo = true
rssLimit = 10

[pagination]
  pagerSize = 10

[taxonomies]
  tags = "tags"
  categories = "categories"

# The theme ships its own markup defaults. These are repeated here so the site
# does not depend on theme config merge order.
[markup]
  [markup.goldmark.renderer]
    unsafe = true

  # KaTeX needs the raw delimiters. Goldmark passthrough keeps them intact.
  [markup.goldmark.extensions.passthrough]
    enable = true
    [markup.goldmark.extensions.passthrough.delimiters]
      block = [['$$', '$$'], ['\[', '\]']]
      inline = [['$', '$'], ['\(', '\)']]

  [markup.highlight]
    noClasses = false

  [markup.tableOfContents]
    startLevel = 2
    endLevel = 6
    ordered = false

# The theme config declares a menu that points at the theme repository.
# These entries use the same identifiers, so they replace the theme entries.
[[menu.main]]
  identifier = "posts"
  name = "Blog"
  url = "/posts/"
  weight = 1
