[params]
  title = 'Notes/Rambling of a 0x engineer'
  author = 'Biswa Prakash Mishra'
  description = 'Notes and rambling of a 0x engineer. Distributed systems, databases, and whatever else I am reading.'
  keywords = ["blog", "distributed systems", "databases", "notes", "rust", "go"]

  dateFormat = "2 January 2006"
  rootFontSize = "100%"
  since = "2022"

  toc = true
  math = true
  showWordCount = true
  showReadingTime = true
  enableInlineShortcodes = true

  # Auto-numbering counts from the first h2. These posts use h3 and h4 inside
  # bullet lists, so the numbers start at "0.1". Off until the headings change.
  numberedSubtitles = false

  # Adds dots above bold Chinese text. This blog is English only.
  emphasisWithDots = false

  # Sends the search query to DuckDuckGo. Off by choice.
  enableDuckDuckGoSearchBox = false

  customCSS = []
  customJS = []

  footnote = """
Powered by <a class=link href=https://gohugo.io target=_blank rel=noopener>Hugo</a> |
Theme <a class=link href=https://github.com/michaelneuper/hugo-texify3 target=_blank rel=noopener>TeXify3</a>
"""

  # The theme config supplies the theme author's giscus snippet. This empty
  # value replaces it. Put your own giscus or Disqus snippet here to add comments.
  [params.commentEngine]
    code = ""

  # The theme config supplies the theme author's Buy Me A Coffee widget.
  # This empty value replaces it.
  [params.buymeacoffee]
    code = ""

  [params.sharingbuttons]
    facebook = false
    twitter = false
    email = false
    linkedin = false
    reddit = false
    whatsapp = false
    hackernews = false
    telegram = false

# The theme config supplies the theme author's Google Analytics ID for the
# production environment. This empty value replaces it.
[services]
  [services.googleAnalytics]
    ID = ""
